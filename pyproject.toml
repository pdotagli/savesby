[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdotagli-savesby"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别提示词缓存的省钱归因上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pdotagli" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pdotagli.github.io"
Repository = "https://github.com/pdotagli/savesby"
Issues = "https://github.com/pdotagli/savesby/issues"

[project.scripts]
savesby = "savesby:main"

[tool.setuptools]
py-modules = ["savesby"]
